# 服务端地址：真实联调时改成 A 机的 IP，例如 http://192.168.1.21:8080
# 对应契约 contracts/openapi.yaml 里的 servers
app.server.baseUrl=http://localhost:8080

# 运行模式：
#   mock = 本地模拟。登录用假账号，座位用本地假数据，完全不连服务端（手册 W2）
#   http = 调真实接口。登录 POST /api/v1/auth/login，座位 GET /api/v1/admin/seats（手册 W3）
#
# 也可以不改文件，启动时直接传参：
#   mvn javafx:run -Dapp.server.baseUrl=http://192.168.1.21:8080 -Dapp.auth.mode=http
app.auth.mode=mock
