name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# -Djavafx.platform=linux：管理端 pom 默认按 Windows 解析 JavaFX 依赖，
# Linux 构建机上要覆盖成 linux，否则解析不到对应 classifier 的 jar。

jobs:
  unit:
    name: 编译 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译并跑单元测试
        run: mvn -B -ntp -Djavafx.platform=linux test

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  integration:
    name: 集成测试（真实 MySQL）
    runs-on: ubuntu-latest
    needs: unit

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: seatkeeper_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      SEATKEEPER_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/seatkeeper_test?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      SEATKEEPER_TEST_DB_USER: root
      SEATKEEPER_TEST_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 集成测试（Flyway 建表 + 唯一索引 + 并发）
        run: mvn -B -ntp -Pintegration -Djavafx.platform=linux verify

      - name: 上传集成测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/**'
          if-no-files-found: ignore

  package:
    name: 打包可运行 JAR
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 打包
        run: mvn -B -ntp -DskipTests -Djavafx.platform=linux package

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: '**/target/*.jar'
          if-no-files-found: error
